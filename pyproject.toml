[project]
name = "karani"
version = "0.4.0"
description = "A self-hosted AI job-hunt pipeline: hunts postings hourly, qualifies them against your resume, drafts full application packs, and delivers them for human review. It never submits."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kelyn Njeri" }]
requires-python = ">=3.11"
keywords = ["job-search", "ai", "agent", "langgraph", "mcp", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "beautifulsoup4>=4.12",
    "asyncpg>=0.29",
    "lxml>=5.0",           # for BeautifulSoup speed
    "tenacity>=8.2",       # retry with backoff
    "python-dotenv>=1.0",  # .env loading
    "mcp>=2",              # MCP server (mcp_server/); 2.x API (MCPServer)
    # OpenRouter is the default qualifier provider and uses only httpx.
    # Anthropic direct is available via the `anthropic` extra.
]

[project.urls]
Homepage = "https://github.com/cod3smith/karani"
Issues = "https://github.com/cod3smith/karani/issues"
Changelog = "https://github.com/cod3smith/karani/commits/main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.5"]
anthropic = ["anthropic>=0.40"]
# Semantic index (pgvector via psycopg) + local extraction (ollama client);
# basic mode needs none of this.
memory = ["mem0ai>=0.1", "ollama>=0.3", "psycopg[binary,pool]>=3.1"]
slack = ["slack-sdk>=3.27", "aiohttp>=3.9"]  # Socket Mode listener only; pushes use httpx
orchestrator = ["langgraph>=0.2"]  # graph-structured background orchestration (ADR 0013)
artifacts = ["minio>=7.2"]  # per-job resume/letter objects + presigned links (ADR 0014)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `pg` tests need a reachable Postgres, so they are the one exception to
# the no-network rule and are excluded from default runs (`make test-pg`).
markers = ["pg: requires a reachable Postgres (compose db)"]
addopts = "-m 'not pg'"

[project.scripts]
karani = "karani.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["karani"]
