[project]
name = "karani"
version = "0.2.0"
description = "Ingestion pipeline for SF-band, global-remote engineering roles"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "beautifulsoup4>=4.12",
    "asyncpg>=0.29",
    "lxml>=5.0",           # for BeautifulSoup speed
    "tenacity>=8.2",       # retry with backoff
    "python-dotenv>=1.0",  # .env loading
    "mcp>=2",              # MCP server (mcp_server/); 2.x API (MCPServer)
    # OpenRouter is the default qualifier provider and uses only httpx.
    # Anthropic direct is available via the `anthropic` extra.
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]
anthropic = ["anthropic>=0.40"]
# Semantic index (pgvector via psycopg) + local extraction (ollama client);
# basic mode needs none of this.
memory = ["mem0ai>=0.1", "ollama>=0.3", "psycopg[binary,pool]>=3.1"]
slack = ["slack-sdk>=3.27", "aiohttp>=3.9"]  # Socket Mode listener only; pushes use httpx
orchestrator = ["langgraph>=0.2"]  # graph-structured background orchestration (ADR 0013)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
ingest = "ingestion.cli:main"
karani-mcp = "mcp_server.__main__:main"
karani-slack = "slackbridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "ingestion", "qualification", "drafting", "intel", "memory",
    "slackbridge", "notionsync", "autopilot", "orchestration", "mcp_server",
]
