# karani.toml — what to hunt, which providers, which endpoints.
# Secrets NEVER live here: API keys and tokens go in .env / environment.
# Docs: CONTRIBUTING.md and docs/adrs/0015. Re-judge stored roles after
# edits with: karani refilter
version = 1

[profile]
roles = ["software_engineering", "ml_ai", "research"]
seniority = ["senior", "staff", "principal", "lead"]
must_have_any = ["python", "typescript", "go", "rust"]
exclude_titles = []

[positioning]
based_in = "City, Country"
candidate = "a senior software engineer"
narrative = "targeting fully-remote roles at globally-distributed companies paying at least $160,000 base, or roles that sponsor a visa and relocation (EU, Japan preferred)"

# Your legal facts. Every work-authorization answer on an application
# form is derived from these deterministically — a model never answers
# "are you authorized to work in X", because that is an attestation you
# are accountable for. Leave work_authorized_in empty and nothing will
# ever claim authorization on your behalf.
[legal]
citizenships = ["Kenya"]
based_in_country = "Kenya"
work_authorized_in = ["Kenya"]          # no sponsorship needed here
remote_engagement = ["employer_of_record", "contractor"]
relocation_open_to = ["EU", "Japan"]
notice_period_days = 30

[profile_sources]            # career-runner Phase 1: the profile core
# LinkedIn's official data export ("Get a copy of your data") — a ZIP
# or the unpacked folder. Never a scraper: that breaks their terms and
# returns worse data than the export you can simply download.
# linkedin_export = "data/linkedin-export.zip"
# portfolio_url = "https://your-site.example"

[[shape]]
name = "global-remote"
remote = "required"
comp_floor_usd = 160000

[[shape]]
name = "relocation"
destinations = ["EU", "Japan"]
requires = ["visa_sponsorship"]

# Per-task LLM routing. Tasks: qualify, draft, humanize, tailor, prep,
# followup, agent — each falls back to [llm.default]. Providers:
#   anthropic   Claude, direct (ANTHROPIC_API_KEY)
#   openrouter  hosted, many models (OPENROUTER_API_KEY)
#   openai      api.openai.com (OPENAI_API_KEY) — or ANY OpenAI-compatible
#               cloud via base_url + api_key_env, e.g. Groq/Together
#   local       Ollama / LM Studio / vLLM — no key, zero token cost
# Spend is capped per month; past the cap karani swaps in the local
# model rather than stopping or overspending (ADR 0019).
[llm.default]
provider = "anthropic"
model = "claude-opus-5-5"

[llm.qualify]                  # bulk tier: cheapest model + cached prefix
provider = "anthropic"
model = "claude-haiku-5-5"
effort = "low"

[llm.draft]                    # low volume, high stakes
provider = "anthropic"
model = "claude-opus-5-5"

[llm.humanize]                 # line-editing needs no hosted model
provider = "local"
model = "llama3.2:3b"

# Any OpenAI-compatible cloud, no code changes — name the env var
# holding the key; the key itself stays in .env:
# [llm.tailor]
# provider = "openai"
# model = "llama-3.3-70b-versatile"
# base_url = "https://api.groq.com/openai/v1"
# api_key_env = "GROQ_API_KEY"

[budget]
monthly_usd = 15.0             # karani's slice of the account
warn_at = 0.8                  # Slack notice at 80% of the cap

[autopilot]
min_fit = 85
# verify = true    # agent double-checks each candidate before drafting (billed)
max_drafts_per_day = 5

[coach]
# Build an interview prep pack automatically when an application moves
# to `screen` or `interview` (two billed calls, whatever drove the
# transition). KARANI_AUTO_PREP=off overrides this at the shell.
auto_prep = true

# [integrations] — uncomment as you connect them (ids here, tokens in .env)
# [slack]
# channel = "D0XXXXXXX"
# allowed_users = ["U0XXXXXXX"]
# [notion]
# database_id = "..."
