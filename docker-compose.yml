# karani infrastructure — dedicated, local, disposable.
#
#   make infra-up          # postgres (with pgvector) on localhost:5433
#   make infra-up-llm      # + ollama on localhost:11434
#   make infra-down        # stop; volumes persist
#
# Point .env at it:
#   DATABASE_URL=postgresql://karani:karani@localhost:5433/karani
#
# pgvector serves double duty: karani's relational store AND the vector
# backend for the mem0 memory layer (see docs/memory.md). One database,
# one backup story, no extra vector-store service.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: karani-db
    environment:
      POSTGRES_USER: karani
      POSTGRES_PASSWORD: karani
      POSTGRES_DB: karani
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - karani_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karani -d karani"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Application artifacts: tailored resume + cover letter per job, with
  # presigned links on the Slack review card. Ports 9010/9011 — 9000 is
  # taken by other stacks on this machine.
  minio:
    image: minio/minio:latest
    container_name: karani-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: karani
      MINIO_ROOT_PASSWORD: karani-local-secret
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - karani_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local LLM for zero-cost qualification and memory extraction.
  # Opt-in: `docker compose --profile local-llm up -d`.
  # After first start: `docker exec karani-ollama ollama pull qwen3:4b`
  #
  # macOS: DO NOT use this container — Docker on Mac has no GPU
  # passthrough, so inference runs CPU-only in a VM (measured 30-60x
  # slower than native). Install Ollama.app instead (same port 11434);
  # this profile is for Linux hosts with --gpus. See docs/operations.md.
  ollama:
    image: ollama/ollama:latest
    container_name: karani-ollama
    profiles: ["local-llm"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - karani_ollama:/root/.ollama

volumes:
  karani_pgdata:
  karani_ollama:
  karani_minio:
