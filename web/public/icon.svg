<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="karani">
  <!--
    The display variant, for 32px and up. The small variant
    (favicon.svg) has thicker bars and survives a 16px tab strip.

    A spine and three bars descending in length, the shortest one
    accented: a list karani has filled in down to the last line, which is
    yours to sign. The descending rhythm is the idea, so it is what
    scripts/check-mark.mjs pins.

    Geometry is the brand kit's, unchanged. The colour is not: the kit
    draws this in dark green on cream, which is close to invisible on the
    console's near-black. These are the site's own tokens.
  -->
  <g fill="#F6F7F9">
    <rect x="10" y="8" width="9" height="48" rx="4.5" />
    <rect x="27" y="8" width="28" height="9" rx="4.5" />
    <rect x="27" y="27.5" width="20" height="9" rx="4.5" />
  </g>
  <rect x="27" y="47" width="9" height="9" rx="4.5" fill="#7DD3FC" />
</svg>
