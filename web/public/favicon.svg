<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="karani">
  <!--
    The small variant, for anything below 32px. Thicker bars and a
    thicker spine, because the display variant's 9-unit bars land at
    about two pixels on a 16px tab strip.

    The spine and the two long bars default to the dark ink so the mark
    is visible on a light tab strip, and flip to the pale fill inside the
    dark-scheme media query. The accent bar is the brand blue in both.
  -->
  <style>
    .sheet { fill: #0B0D10; }
    @media (prefers-color-scheme: dark) {
      .sheet { fill: #F6F7F9; }
    }
  </style>
  <g class="sheet">
    <rect x="8" y="6" width="12" height="52" rx="6" />
    <rect x="26" y="6" width="30" height="12" rx="6" />
    <rect x="26" y="26" width="22" height="12" rx="6" />
  </g>
  <rect x="26" y="46" width="12" height="12" rx="6" fill="#7DD3FC" />
</svg>
