<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="karani">
  <!--
    The small variant, for anything below 32px. Thicker slabs and a
    thicker stroke, because the display variant's 6-unit slabs land at
    under a pixel on a 16px tab strip.

    The letterforms default to the dark ink so the mark is visible on a
    light tab strip, and flip to the cool off-white inside the
    dark-scheme media query. The blue stroke is the brand in both.
  -->
  <style>
    .sheet { fill: #0B0D10; }
    @media (prefers-color-scheme: dark) {
      .sheet { fill: #F6F7F9; }
    }
  </style>
  <g class="sheet">
    <rect x="18" y="10" width="10" height="80" />
    <rect x="34" y="20" width="48" height="10" />
    <rect x="34" y="40" width="48" height="10" />
    <rect x="34" y="60" width="30" height="10" />
  </g>
  <polygon points="18,78 82,70 82,84 18,92" fill="#7DD3FC" />
</svg>
